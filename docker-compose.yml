version: "3.9"
services:
  backend:
    build: ./backend
    container_name: iai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE}
      - SUMMARY_MODE=${SUMMARY_MODE}
      - FAISS_INDEX_PATH=${FAISS_INDEX_PATH}
    depends_on:
      - redis
      - postgres
    ports:
      - "8000:8000"
    networks:
      - appnet
    # Optional GPU support (uncomment if using NVIDIA runtime)
    # runtime: nvidia
  frontend:
    build: ./frontend
    container_name: iai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - appnet
  redis:
    image: redis:7-alpine
    container_name: iai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - appnet
  postgres:
    image: postgres:15
    container_name: iai_postgres
    environment:
      - POSTGRES_USER=podcast
      - POSTGRES_PASSWORD=podcast
      - POSTGRES_DB=podcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
  worker:
    build: ./backend
    container_name: iai_worker
    command: celery -A app.workers.celery_tasks.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - appnet
  nginx:
    image: nginx:1.28
    container_name: iai_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  redis_data:
  pgdata:
